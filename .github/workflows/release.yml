name: Release

on:
  workflow_run:
    workflows: ["Release Request"]
    types: [completed]

permissions: {}

jobs:
  prepare:
    name: Validate release request
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (
        (github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')) ||
        (github.event.workflow_run.event == 'workflow_dispatch' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch)
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.request.outputs.tag }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      release_name: ${{ steps.request.outputs.release_name }}
      prerelease: ${{ steps.request.outputs.prerelease }}
      stable: ${{ steps.request.outputs.stable }}
      draft: ${{ steps.request.outputs.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download manual release request metadata
        if: github.event.workflow_run.event == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: release-request
          path: release-request
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate the selected release source
        id: request
        env:
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_REF: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/validate-release-request.mjs

  validate:
    name: Validate
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Validate locked FFmpeg dependency
        run: node scripts/ffmpeg-dependency.mjs validate-lock --lock .github/ffmpeg.lock.json --require-ready

      - run: cargo fmt --all --check

      - run: cargo test --workspace --all-targets

      - working-directory: apps/desktop
        run: npm ci

      - working-directory: apps/desktop
        run: npm run build

  build:
    name: Build ${{ matrix.name }}
    needs: [prepare, validate]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            tauri_args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - name: windows-x64
            os: windows-2022
            tauri_args: ""
            rust_targets: ""
          - name: linux-x64
            os: ubuntu-22.04
            tauri_args: ""
            rust_targets: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust stable with target
        if: matrix.rust_targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Rust stable
        if: matrix.rust_targets == ''
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Validate stable Windows signing credentials
        if: runner.os == 'Windows' && needs.prepare.outputs.stable == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Error "WINDOWS_CERTIFICATE is required for stable Windows releases."
            exit 1
          }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Error "WINDOWS_CERTIFICATE_PASSWORD is required for stable Windows releases."
            exit 1
          }

      - name: Stage release FFmpeg
        shell: bash
        run: scripts/stage-release-ffmpeg.sh --target "${{ matrix.name }}"

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && needs.prepare.outputs.stable == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "APPLE_CERTIFICATE is required for stable macOS releases." >&2
            exit 1
          fi
          if [[ -z "${APPLE_CERTIFICATE_PASSWORD:-}" || -z "${KEYCHAIN_PASSWORD:-}" ]]; then
            echo "APPLE_CERTIFICATE_PASSWORD and KEYCHAIN_PASSWORD are required when APPLE_CERTIFICATE is set." >&2
            exit 1
          fi

          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          CERT_ID="$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application|Apple Distribution|Apple Development/ {print $2; exit}')"
          if [[ -z "$CERT_ID" ]]; then
            echo "No usable Apple code-signing identity found in build keychain." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Sign staged macOS media tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          SIGNING_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          SIGNING_ARGS=(--force --sign "$SIGNING_IDENTITY")
          if [[ "$SIGNING_IDENTITY" != "-" ]]; then
            SIGNING_ARGS+=(--timestamp --options runtime)
          fi
          for tool in apps/desktop/src-tauri/ffmpeg/bin/ffmpeg apps/desktop/src-tauri/ffmpeg/bin/ffprobe; do
            codesign "${SIGNING_ARGS[@]}" "$tool"
            codesign --verify --strict "$tool"
          done

      - name: Validate bundled media tools
        shell: bash
        run: |
          REPORT="$(cargo run -q -p vid2dataset -- doctor)"
          echo "$REPORT"
          if [[ "$(grep -c bundled <<<"$REPORT")" -lt 2 ]]; then
            echo "doctor did not report both tools as bundled" >&2
            exit 1
          fi
          export PATH="$GITHUB_WORKSPACE/apps/desktop/src-tauri/ffmpeg/bin:$PATH"
          cargo test -p vid2dataset-core --test extraction extracts_synthetic_video_and_writes_manifests_when_ffmpeg_exists

      - name: Build Tauri bundles
        shell: bash
        working-directory: apps/desktop
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # MSI only accepts numeric prerelease identifiers.
            WINDOWS_BUNDLE_VERSION="$(node --input-type=module -e '
              const match = /^v(\d+)\.(\d+)\.(\d+)(?:-(?:alpha|beta|rc)\.(\d+))?$/i.exec(process.env.RELEASE_TAG ?? "");
              if (!match) process.exit(1);
              process.stdout.write(`${match[1]}.${match[2]}.${match[3]}${match[4] ? `-${match[4]}` : ""}`);
            ')"
            npm run tauri build -- --config "{\"version\":\"$WINDOWS_BUNDLE_VERSION\"}"
          elif [[ "${RUNNER_OS}" == "macOS" ]]; then
            MAC_SIGNING_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
            if [[ "${RELEASE_STABLE}" == "true" && "$MAC_SIGNING_IDENTITY" == "-" ]]; then
              echo "Stable macOS releases require an Apple signing identity." >&2
              exit 1
            fi
            MAC_SIGNING_CONFIG="$(MAC_SIGNING_IDENTITY="$MAC_SIGNING_IDENTITY" node -e 'process.stdout.write(JSON.stringify({bundle:{macOS:{signingIdentity:process.env.MAC_SIGNING_IDENTITY}}}))')"
            if [[ -n "${TAURI_ARGS:-}" ]]; then
              read -r -a TAURI_ARGUMENTS <<<"$TAURI_ARGS"
            else
              TAURI_ARGUMENTS=()
            fi
            npm run tauri build -- "${TAURI_ARGUMENTS[@]}" --config "$MAC_SIGNING_CONFIG"
          else
            npm run tauri build
          fi
        env:
          TAURI_ARGS: ${{ matrix.tauri_args }}
          APPLE_ID: ${{ needs.prepare.outputs.stable == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ needs.prepare.outputs.stable == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ needs.prepare.outputs.stable == 'true' && secrets.APPLE_TEAM_ID || '' }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_STABLE: ${{ needs.prepare.outputs.stable }}

      - name: Verify macOS application signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_STABLE: ${{ needs.prepare.outputs.stable }}
        run: |
          APP_ROOTS=()
          for root in "$GITHUB_WORKSPACE/target/release" "$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release" "$GITHUB_WORKSPACE/apps/desktop/src-tauri/target/release" "$GITHUB_WORKSPACE/apps/desktop/src-tauri/target/aarch64-apple-darwin/release"; do
            [[ -d "$root" ]] && APP_ROOTS+=("$root")
          done
          if [[ "${#APP_ROOTS[@]}" -eq 0 ]]; then
            echo "No Tauri release directory was found for signature verification." >&2
            exit 1
          fi
          APP_BUNDLES=()
          while IFS= read -r -d '' app; do
            APP_BUNDLES+=("$app")
          done < <(find "${APP_ROOTS[@]}" -type d -path "*/bundle/*.app" -prune -print0)
          if [[ "${#APP_BUNDLES[@]}" -eq 0 ]]; then
            echo "No macOS application bundle was found for signature verification." >&2
            exit 1
          fi
          for app in "${APP_BUNDLES[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            DETAILS="$(codesign -dv --verbose=4 "$app" 2>&1)"
            if [[ "$RELEASE_STABLE" == "true" ]]; then
              grep -F "Authority=${APPLE_SIGNING_IDENTITY:-}" <<<"$DETAILS" >/dev/null
            else
              grep -F "Signature=adhoc" <<<"$DETAILS" >/dev/null
            fi
          done

      - name: Sign Windows artifacts
        if: runner.os == 'Windows' && needs.prepare.outputs.stable == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "vid2dataset-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            Write-Error "signtool.exe was not found on the Windows runner."
            exit 1
          }

          $artifacts = Get-ChildItem "target\release\bundle" -Recurse -Include *.exe,*.msi -File
          if (-not $artifacts) {
            Write-Error "No Windows artifacts were found to sign."
            exit 1
          }

          foreach ($artifact in $artifacts) {
            & $signtool.FullName sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $artifact.FullName
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            & $signtool.FullName verify /pa /all /v $artifact.FullName
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Collect artifacts and checksums
        shell: bash
        run: scripts/archive-release-artifacts.sh "${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: vid2dataset2-${{ matrix.name }}
          path: dist/release/${{ matrix.name }}/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/release-artifacts

      - name: Write combined checksums
        run: |
          cd dist/release-artifacts
          find . -type f ! -name 'SHA256SUMS*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.source_sha }}
          name: ${{ needs.prepare.outputs.release_name }}
          draft: ${{ needs.prepare.outputs.draft }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: |
            dist/release-artifacts/**/*
          body_path: ${{ format('docs/release-notes/{0}.md', needs.prepare.outputs.tag) }}
